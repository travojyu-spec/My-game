<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1a10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Перекрёсток миров</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./assets/fonts/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1a10;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      /* Невидимый замер безопасных отступов: вырез камеры, панели системы. */
      #safe-probe {
        position: fixed;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
        box-sizing: border-box;
        background: #0f1a10;
        color: #f1dcad;
        font-family: 'Tiny5', monospace;
        font-size: 16px;
        line-height: 24px;
        text-align: center;
        z-index: 30;
      }
      .overlay h1 {
        margin: 0;
        font-size: 24px;
        line-height: 32px;
        font-weight: 400;
      }
      .overlay button {
        font: inherit;
        color: #3b2414;
        background: #f9d992;
        border: 4px solid #4c301e;
        border-radius: 6px;
        box-shadow: 0 4px 0 #291d15;
        min-height: 56px;
        padding: 8px 24px;
      }
      #boot {
        display: flex;
      }
      #boot.done {
        display: none;
      }
      @media (orientation: portrait) {
        #rotate {
          display: flex;
        }
      }
      .phone {
        width: 48px;
        height: 80px;
        border: 4px solid #f1dcad;
        border-radius: 8px;
        animation: turn 2.4s ease-in-out infinite;
      }
      @keyframes turn {
        0%,
        30% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="safe-probe"></div>
    <div id="rotate" class="overlay" role="dialog" aria-label="Поверните телефон">
      <div class="phone"></div>
      <h1>Поверните телефон</h1>
      <div>Игра рассчитана на горизонтальный экран.</div>
      <button id="rotate-fullscreen" type="button" hidden>Играть на весь экран</button>
    </div>
    <div id="boot" class="overlay"><div id="boot-text">Загрузка…</div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
